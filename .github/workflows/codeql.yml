name: CodeQL Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run at 06:00 UTC every Monday
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.1
        with:
          languages: ${{ matrix.language }}
          # Security-focused suite. Avoids the code-quality rules (unused vars,
          # unreachable code, etc.) that are not security issues and add noise.
          queries: security-extended
          # Exclude vendored/bundled third-party assets from analysis.
          config: |
            paths-ignore:
              - public/**
              - '**/*.min.js'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.1
        with:
          category: "/language:${{ matrix.language }}"
